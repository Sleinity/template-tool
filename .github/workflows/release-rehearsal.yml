name: Certified SDK publication rehearsal
on:
  pull_request:
    branches: [main, codex/sdk-1-release]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: sdk-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise publication, retry and workflow contracts
        run: node --test scripts/release-publication/*.test.mjs scripts/release-delivery/*.test.mjs
      - name: Retrieve exact certified delivery without fixture decryption
        run: node scripts/release-publication/cli.mjs prepare --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/rehearsal-retention"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain certified delivery for the release
        id: retained
        uses: actions/upload-artifact@v4
        with:
          name: sdk-1.0.0-certified-delivery
          path: ${{ runner.temp }}/certified-delivery/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Record retained artifact identity
        run: |
          node scripts/release-publication/retention-record.mjs "$RUNNER_TEMP/rehearsal-retention" "$RETAINED_ID" "$RETAINED_DIGEST"
        env:
          RETAINED_ID: ${{ steps.retained.outputs.artifact-id }}
          RETAINED_DIGEST: ${{ steps.retained.outputs.artifact-digest }}
      - name: Verify source and rehearse registry decisions without publishing
        run: node scripts/release-publication/cli.mjs rehearse --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/rehearsal"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify supplied archives in npm and pnpm hosts
        run: |
          node scripts/repository/verify-runtime-release-consumer.mjs --archives "$RUNNER_TEMP/certified-delivery"
          TEMPLATE_CONSUMER_PACKAGE_MANAGER=pnpm node scripts/repository/verify-runtime-release-consumer.mjs --archives "$RUNNER_TEMP/certified-delivery"
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: '1.0.0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-publication-rehearsal-results
          path: |
            ${{ runner.temp }}/rehearsal-retention/
            ${{ runner.temp }}/rehearsal/
          retention-days: 90
          if-no-files-found: warn
