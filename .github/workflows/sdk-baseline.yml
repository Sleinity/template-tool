name: Stable SDK baseline verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: sdk-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Sleinity/template-tool' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test baseline, retirement and historical publication contracts
        run: node --test scripts/release-baseline/*.test.mjs scripts/release-publication/*.test.mjs scripts/release-delivery/*.test.mjs
      - name: Verify stable release and strict registry hosts without temporary inputs
        run: pnpm sdk:baseline:verify --hosts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
