name: Update SDK 2.0.1 host-kit changelog

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdk-host-kit-2.0.1
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: private-sdk-release
    permissions:
      contents: write
    env:
      TEMPLATE_PACKAGE_FIXTURE_DIR: /tmp/host-kit-no-private-fixtures
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release-delivery/*.test.mjs
      - name: Back up current delivery and add the consolidated changelog
        run: node scripts/release-delivery/changelog.mjs prepare "$RUNNER_TEMP/host-kit-changelog"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain original delivery before the documentation update
        uses: actions/upload-artifact@v4
        with:
          name: sdk-2.0.1-before-changelog-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/host-kit-changelog/backup/
            ${{ runner.temp }}/host-kit-changelog/CHANGELOG-BASELINE.json
          retention-days: 90
          if-no-files-found: error
      - run: pnpm exec playwright install --with-deps chromium
      - name: Accept the updated kit with both managers
        run: |
          for manager in npm pnpm; do
            node scripts/host-starter/verify-kit.mjs --delivery "$RUNNER_TEMP/host-kit-changelog/public" --manager "$manager"
          done
      - name: Publish the kit documentation and seventh release file
        run: node scripts/release-delivery/changelog.mjs publish "$RUNNER_TEMP/host-kit-changelog"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-2.0.1-changelog-${{ github.run_id }}
          path: ${{ runner.temp }}/host-kit-changelog/
          retention-days: 90
          if-no-files-found: warn
