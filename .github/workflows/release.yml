name: Publish private SDK packages

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      prepare_runtime_handoff:
        description: "Refresh the sdk-v0.2.0 Lovable runtime assets from published packages"
        required: false
        default: false
        type: boolean

env:
  SDK_VERSION: "0.2.0"
  SDK_RELEASE_TAG: "sdk-v0.2.0"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: private-sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sleinity"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:portable
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published core consumer
        run: pnpm published-core:verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_CORE_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Prepare published runtime Lovable handoff
        if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.prepare_runtime_handoff == true
        run: |
          mkdir -p release-artifacts
          for package_name in template-core template-browser template-react; do
            npm pack "@sleinity/${package_name}@${SDK_VERSION}" \
              --registry=https://npm.pkg.github.com \
              --pack-destination=release-artifacts
          done
          node scripts/repository/create-runtime-release-handoff.mjs \
            release-artifacts \
            release-artifacts
          cp docs/sdk/BAS_NARROWCASTING_LOVABLE_PROMPTS.md \
            release-artifacts/BAS-NARROWCASTING-LOVABLE-PROMPTS.md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify secret-free Lovable runtime consumer (npm)
        if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.prepare_runtime_handoff == true
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify secret-free Lovable runtime consumer (pnpm)
        if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.prepare_runtime_handoff == true
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts
        env:
          TEMPLATE_CONSUMER_PACKAGE_MANAGER: pnpm
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Create private SDK release and upload Lovable runtime handoff
        if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.prepare_runtime_handoff == true
        run: |
          gh release view "$SDK_RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$SDK_RELEASE_TAG" \
              --verify-tag \
              --title "SDK 0.2.0" \
              --notes "Private SDK 0.2.0. The attached archives were downloaded from GitHub Packages and include a checksum-verified Lovable Business runtime handoff."
          gh release edit "$SDK_RELEASE_TAG" \
            --notes "Private SDK 0.2.0. The attached core, browser, and React archives were downloaded from GitHub Packages and include a checksum-verified Lovable Business narrowcasting handoff."
          gh release upload "$SDK_RELEASE_TAG" \
            release-artifacts/sleinity-template-core-0.2.0.tgz \
            release-artifacts/sleinity-template-browser-0.2.0.tgz \
            release-artifacts/sleinity-template-react-0.2.0.tgz \
            release-artifacts/SHA256SUMS \
            release-artifacts/BAS-RUNTIME-HANDOFF.md \
            release-artifacts/BAS-NARROWCASTING-LOVABLE-PROMPTS.md \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain published package tags
        run: |
          git tag --list '@sleinity/*' | while IFS= read -r tag; do
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          done
