name: Publish SDK packages

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      prepare_runtime_handoff:
        description: "Refresh the current SDK integration assets from published packages"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: private-sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sleinity"
      - name: Resolve fixed SDK release metadata
        run: node scripts/repository/sdk-runtime-manifest.mjs env >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:portable
      - name: Install pinned Chromium for packed reference acceptance
        run: pnpm exec playwright install chromium
      - run: pnpm template-editor:acceptance
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain published package tags
        run: |
          git tag --list '@sleinity/*' | while IFS= read -r tag; do
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          done

  handoff:
    needs: publish
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.prepare_runtime_handoff == true)
      )
    runs-on: ubuntu-latest
    environment: private-sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sleinity"
      - name: Resolve fixed SDK release metadata
        run: node scripts/repository/sdk-runtime-manifest.mjs env >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Verify current source before a manual handoff refresh
        if: github.event_name == 'workflow_dispatch'
        run: pnpm ci:portable
      - name: Verify published core consumer
        run: pnpm published-core:verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_CORE_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Prepare published runtime handoff
        run: |
          mkdir -p release-artifacts
          while IFS= read -r package_name; do
            npm pack "${package_name}@${SDK_VERSION}" \
              --registry=https://npm.pkg.github.com \
              --pack-destination=release-artifacts
          done < <(node scripts/repository/sdk-runtime-manifest.mjs package-names)
          node scripts/repository/create-runtime-release-handoff.mjs \
            release-artifacts \
            release-artifacts
          node scripts/repository/create-core-release-handoff.mjs \
            "release-artifacts/sleinity-template-core-${SDK_VERSION}.tgz" \
            release-artifacts
          cp docs/sdk/INSTALLATION.md \
            release-artifacts/SDK-INSTALLATION.md
          cp docs/sdk/SDK_CAPABILITIES.md \
            release-artifacts/SDK-CAPABILITIES.md
          cp docs/sdk/AGENT_INTEGRATION_PROMPTS.md \
            release-artifacts/AGENT-INTEGRATION-PROMPTS.md
          cp docs/sdk/SDK_0_2_TO_0_7_LOVABLE_HANDOFF.md \
            release-artifacts/SDK-0.2-TO-0.7-LOVABLE-HANDOFF.md
          cp docs/sdk/SDK_0_7_MIGRATION.md \
            release-artifacts/SDK-0.7-MIGRATION.md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Install pinned Chromium for runtime verification
        run: pnpm exec playwright install chromium
      - name: Verify secret-free vendored runtime consumer (npm)
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify secret-free vendored runtime consumer (pnpm)
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts
        env:
          TEMPLATE_CONSUMER_PACKAGE_MANAGER: pnpm
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify packed template editor reference from published archives
        run: >-
          node scripts/repository/verify-template-editor-reference.mjs
          --archives release-artifacts
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify repository distribution visibility
        run: |
          actual_visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          test "$actual_visibility" = "$SDK_RELEASE_VISIBILITY"
          test "$SDK_LICENSE_POLICY" = "sleinity-tools-only"
          test "$SDK_AUTHORIZED_USE" = "Sleinity-owned applications"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create SDK release and upload integration handoff
        run: |
          mapfile -t release_archives < <(
            node scripts/repository/sdk-runtime-manifest.mjs \
              archive-paths \
              release-artifacts
          )
          gh release view "$SDK_RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$SDK_RELEASE_TAG" \
              --verify-tag \
              --title "$SDK_RELEASE_TITLE" \
              --notes "Public SDK ${SDK_VERSION} assets derived from GitHub Packages. UNLICENSED; authorized for Sleinity-owned applications only."
          gh release edit "$SDK_RELEASE_TAG" \
            --notes "Public SDK ${SDK_VERSION} assets derived from GitHub Packages. UNLICENSED; authorized for Sleinity-owned applications only. See SDK-RUNTIME-HANDOFF.md for checksums and integration instructions."
          gh release upload "$SDK_RELEASE_TAG" \
            "${release_archives[@]}" \
            release-artifacts/SHA256SUMS \
            release-artifacts/CORE-SHA256SUMS \
            release-artifacts/SDK-CORE-HANDOFF.md \
            release-artifacts/SDK-RUNTIME-HANDOFF.md \
            release-artifacts/SDK-INSTALLATION.md \
            release-artifacts/SDK-CAPABILITIES.md \
            release-artifacts/AGENT-INTEGRATION-PROMPTS.md \
            release-artifacts/SDK-0.2-TO-0.7-LOVABLE-HANDOFF.md \
            release-artifacts/SDK-0.7-MIGRATION.md \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
