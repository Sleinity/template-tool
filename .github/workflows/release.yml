name: Publish certified SDK packages
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      prepare_runtime_handoff:
        description: Refresh integration assets from verified published packages
        required: false
        default: false
        type: boolean
      promote_stable:
        description: Promote only after complete Linux/macOS registry and fidelity evidence
        required: false
        default: false
        type: boolean
      resume_existing_tag:
        description: Recover only the reviewed immutable sdk-v1.0.0 tag
        required: false
        default: false
        type: boolean
      expected_tag_commit:
        description: Exact existing tag commit required for recovery
        required: false
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: sdk-publication-${{ github.repository }}-refs/tags/sdk-v1.0.0
  cancel-in-progress: false
env:
  SDK_RESUME_EXISTING_TAG: ${{ inputs.resume_existing_tag || false }}
  SDK_RECOVERY_EXPECTED_TAG_COMMIT: ${{ inputs.expected_tag_commit }}
  SDK_RECOVERY_HANDOFF_INTENT: ${{ inputs.prepare_runtime_handoff || false }}
  SDK_RECOVERY_PROMOTE_INTENT: ${{ inputs.promote_stable || false }}
jobs:
  preflight:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/tags/sdk-v1.0.0') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_existing_tag == true && inputs.prepare_runtime_handoff == false && inputs.promote_stable == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify frozen inputs and macOS fidelity evidence before publication
        run: |
          node scripts/release-publication/cli.mjs prepare --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/preflight"
          node scripts/release-publication/preflight.mjs "$RUNNER_TEMP/certified-delivery"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate pinned exact fixture intake
        run: node scripts/release-publication/fixtures.mjs restore "$RUNNER_TEMP/exact-fixtures"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_CERT_FIXTURE_KEY: ${{ secrets.SDK_CERT_FIXTURE_KEY_20261013C }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full frozen-archive acceptance before any package write
        run: node scripts/release-publication/acceptance.mjs --mode archive --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/acceptance"
      - name: Remove plaintext exact inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/exact-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-publication-preflight
          path: ${{ runner.temp }}/acceptance/report.json
          retention-days: 90
          if-no-files-found: warn
  publish:
    needs: preflight
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/tags/sdk-v1.0.0') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.resume_existing_tag == true && inputs.prepare_runtime_handoff == false && inputs.promote_stable == false)
    runs-on: ubuntu-24.04
    environment: private-sdk-release
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Retrieve the verified frozen train
        run: node scripts/release-publication/cli.mjs prepare --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/publication"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore prior invocation journal before any package write
        run: node scripts/release-publication/resume-journal.mjs "$RUNNER_TEMP/publication"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact archives after human environment approval
        run: pnpm release --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/publication"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RELEASE_ENVIRONMENT: private-sdk-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-publication-journal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          retention-days: 90
          if-no-files-found: warn

  handoff:
    needs: publish
    if: >-
      always() &&
      ((needs.publish.result == 'success' && (github.event_name == 'push' || inputs.resume_existing_tag == true)) ||
      (github.event_name == 'workflow_dispatch' && inputs.prepare_runtime_handoff == true && inputs.resume_existing_tag != true && inputs.promote_stable != true && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment: private-sdk-release
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      SDK_RELEASE_ENVIRONMENT: private-sdk-release
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEMPLATE_RUNTIME_RELEASE_VERSION: '1.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Retrieve the certified comparison authority
        run: node scripts/release-publication/cli.mjs prepare --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/handoff-verification"
      - name: Verify and download all published packages
        run: node scripts/release-publication/cli.mjs preflight --archives "$RUNNER_TEMP/certified-delivery" --download release-artifacts --output "$RUNNER_TEMP/handoff-verification"
      - name: Generate shared published handoff
        run: |
          node scripts/release-delivery/cli.mjs generate --archives release-artifacts --output release-artifacts --mode release --provenance registry-download
          node scripts/release-delivery/cli.mjs verify release-artifacts
      - name: Restore pinned exact fixture inputs
        run: node scripts/release-publication/fixtures.mjs restore "$RUNNER_TEMP/exact-fixtures"
        env:
          SDK_CERT_FIXTURE_KEY: ${{ secrets.SDK_CERT_FIXTURE_KEY_20261013C }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Complete archive and registry host acceptance
        run: |
          node scripts/release-publication/acceptance.mjs --mode archive --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/handoff-archive"
          node scripts/release-publication/acceptance.mjs --mode registry --archives "$RUNNER_TEMP/certified-delivery" --output "$RUNNER_TEMP/handoff-registry"
      - name: Create only a prerelease after verification
        run: |
          gh release view sdk-v1.0.0 >/dev/null 2>&1 || gh release create sdk-v1.0.0 --verify-tag --prerelease --title "SDK 1.0.0" --notes "Certified SDK archives. UNLICENSED; Sleinity-owned applications only. Registry acceptance is required before stable promotion."
      - name: Upload only matching or missing inventory assets
        run: node scripts/release-publication/cli.mjs assets --assets release-artifacts --output "$RUNNER_TEMP/handoff-verification"
      - name: Record immutable verified asset inventory
        run: node scripts/release-publication/asset-inventory.mjs release-artifacts "$RUNNER_TEMP/handoff-registry"
      - name: Remove plaintext exact inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/exact-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-registry-acceptance
          path: |
            ${{ runner.temp }}/handoff-registry/report.json
            ${{ runner.temp }}/handoff-registry/asset-inventory.json
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-handoff-verification
          path: ${{ runner.temp }}/handoff-verification/
          retention-days: 90
          if-no-files-found: warn

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_stable == true && inputs.resume_existing_tag != true && inputs.prepare_runtime_handoff != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: private-sdk-release
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Promote only after human approval and complete immutable evidence
        run: node scripts/release-publication/promotion.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RELEASE_ENVIRONMENT: private-sdk-release
