name: Publish SDK packages

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      prepare_runtime_handoff:
        description: "Refresh the current SDK integration assets from published packages"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  publish:
    # SDK 2.0.1 uses the separately approved functional patch workflow.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v') && github.ref != 'refs/tags/sdk-v2.0.1'
    runs-on: ubuntu-latest
    environment: private-sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sleinity"
      - name: Resolve fixed SDK release metadata
        run: node scripts/repository/sdk-runtime-manifest.mjs env >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:portable
      - uses: ./.github/actions/sdk-certified-inputs
        with:
          certification-run-id: ${{ vars.SDK_RELEASE_CERTIFICATION_RUN_ID }}
          frozen-sha256: ${{ vars.SDK_RELEASE_FROZEN_SHA256 }}
          fixture-key: ${{ secrets.SDK_CERT_FIXTURE_KEY }}
      - name: Install pinned Chromium for packed reference acceptance
        run: pnpm exec playwright install chromium
      - run: node scripts/repository/verify-template-editor-reference.mjs --archives "$SDK_CERTIFIED_ARCHIVES"
      - run: node scripts/repository/verify-template-family-reference.mjs --archives "$SDK_CERTIFIED_ARCHIVES"
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain published package tags
        run: |
          git tag --list '@sleinity/*' | while IFS= read -r tag; do
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          done
      - name: Remove decrypted release test fixtures
        if: always()
        run: rm -rf "$RUNNER_TEMP/sdk-fixtures"

  handoff:
    needs: publish
    if: >-
      always() &&
      (
        (github.event_name == 'push' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.prepare_runtime_handoff == true)
      )
    runs-on: ubuntu-latest
    environment: private-sdk-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@sleinity"
      - name: Resolve fixed SDK release metadata
        run: node scripts/repository/sdk-runtime-manifest.mjs env >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Verify current source before a manual handoff refresh
        if: github.event_name == 'workflow_dispatch'
        run: pnpm ci:portable
      - uses: ./.github/actions/sdk-certified-inputs
        with:
          certification-run-id: ${{ vars.SDK_RELEASE_CERTIFICATION_RUN_ID }}
          frozen-sha256: ${{ vars.SDK_RELEASE_FROZEN_SHA256 }}
          fixture-key: ${{ secrets.SDK_CERT_FIXTURE_KEY }}
      - name: Verify published core consumer
        run: pnpm published-core:verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_CORE_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Prepare shared published runtime handoff
        run: |
          mkdir -p release-artifacts
          while IFS= read -r package_name; do
            npm pack "${package_name}@${SDK_VERSION}" \
              --registry=https://npm.pkg.github.com \
              --pack-destination=release-artifacts
          done < <(node scripts/repository/sdk-runtime-manifest.mjs package-names)
          node scripts/release-delivery/cli.mjs generate \
            --archives release-artifacts --output release-artifacts \
            --mode release --provenance registry-download
          node scripts/release-delivery/cli.mjs verify release-artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Install pinned Chromium for runtime verification
        run: pnpm exec playwright install chromium
      - name: Verify secret-free vendored runtime consumer (npm)
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts --output "$RUNNER_TEMP/sdk-publication-acceptance/npm/consumer"
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify secret-free vendored runtime consumer (pnpm)
        run: >-
          node scripts/repository/verify-runtime-release-consumer.mjs
          --archives release-artifacts --output "$RUNNER_TEMP/sdk-publication-acceptance/pnpm/consumer"
        env:
          TEMPLATE_CONSUMER_PACKAGE_MANAGER: pnpm
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify fresh hosts, font authority and storage from published archives
        run: |
          for manager in npm pnpm; do
            node scripts/host-starter/verify.mjs --archives release-artifacts --manager "$manager" --output "$RUNNER_TEMP/sdk-publication-acceptance/$manager/starter"
            TEMPLATE_CONSUMER_PACKAGE_MANAGER="$manager" node scripts/repository/verify-host-font-authority.mjs --archives release-artifacts --output "$RUNNER_TEMP/sdk-publication-acceptance/$manager/fonts"
            node scripts/repository/verify-blocked-storage.mjs --archives release-artifacts --manager "$manager" --output "$RUNNER_TEMP/sdk-publication-acceptance/$manager/storage"
          done
      - name: Verify packed template editor reference from published archives
        run: >-
          node scripts/repository/verify-template-editor-reference.mjs
          --archives release-artifacts
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify packed Template Family reference from published archives
        run: >-
          node scripts/repository/verify-template-family-reference.mjs
          --archives release-artifacts
        env:
          TEMPLATE_RUNTIME_RELEASE_VERSION: ${{ env.SDK_VERSION }}
      - name: Verify repository distribution visibility
        run: |
          actual_visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          test "$actual_visibility" = "$SDK_RELEASE_VISIBILITY"
          test "$SDK_LICENSE_POLICY" = "sleinity-tools-only"
          test "$SDK_AUTHORIZED_USE" = "Sleinity-owned applications"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create SDK release and upload integration handoff
        run: |
          release_asset_paths="$(node scripts/release-delivery/cli.mjs upload-paths release-artifacts)"
          mapfile -t release_assets <<< "$release_asset_paths"
          gh release view "$SDK_RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$SDK_RELEASE_TAG" \
              --verify-tag \
              --title "$SDK_RELEASE_TITLE" \
              --notes "Public SDK ${SDK_VERSION} assets derived from GitHub Packages. UNLICENSED; authorized for Sleinity-owned applications only."
          gh release edit "$SDK_RELEASE_TAG" \
            --notes "Public SDK ${SDK_VERSION} assets derived from GitHub Packages. UNLICENSED; authorized for Sleinity-owned applications only. See SDK-RUNTIME-HANDOFF.md for checksums and integration instructions."
          gh release upload "$SDK_RELEASE_TAG" "${release_assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove decrypted release test fixtures
        if: always()
        run: rm -rf "$RUNNER_TEMP/sdk-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-host-acceptance
          path: ${{ runner.temp }}/sdk-publication-acceptance/
          retention-days: 3
          if-no-files-found: warn
