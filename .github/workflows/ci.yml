name: Portable CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:portable
      - name: Verify release reference intake contracts
        run: node --test scripts/repository/verify-reviewed-reference-intake.test.mjs
      - name: Verify shared delivery and publication-path contracts
        run: node --test scripts/release-delivery/*.test.mjs
      - name: Install pinned Chromium for packed reference acceptance
        run: pnpm exec playwright install chromium
      - run: pnpm template-editor:acceptance
      - run: pnpm template-family:acceptance

  protected-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard approved evidence from unreviewed edits
        if: github.event_name == 'pull_request'
        run: node scripts/repository/verify-reviewed-reference-intake.mjs "origin/${{ github.base_ref }}"
